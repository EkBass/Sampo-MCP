# TOOL DOCUMENTATION: sampo:get_block_list
tool_description: Get alphabetically sorted array of block names. Fast discovery tool.
params:
    path:
        type: string
        required: false
        default: Projects/Sampo-MCP-source/src
        description: Path to search (file or directory)
returns:
    type: object
    structure:
        total_blocks: integer
        blocks: array (sorted names)
examples:
    - "sampo:get_block_list()"
    - "sampo:get_block_list({ path: 'src/catalogs' })"
    - "sampo:get_block_list({ path: 'src/tools_system.js' })"
notes:
    - Much faster than search_blocks when only names needed
    - No line numbers or file paths (use search_blocks for that)