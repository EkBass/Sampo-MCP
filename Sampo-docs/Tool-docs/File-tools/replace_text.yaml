# TOOL DOCUMENTATION: sampo:replace_text
tool_description: Find and replace exact text block. Text must appear exactly once. Automatic backup by default.
params:
    path:
        type: string
        required: true
        description: File to modify
    old_text:
        type: string
        required: true
        description: Exact text to find (must appear exactly once)
    new_text:
        type: string
        required: true
        description: Replacement text (empty string = delete)
    backup:
        type: boolean
        required: false
        default: true
returns:
    type: object
    success_codes: ["OK"]
    error_codes: ["ERROR", "NOT_FOUND", "MULTIPLE_MATCHES"]
examples:
    - "sampo:replace_text({ path: 'handlers.js', old_text: 'validateUser(data)', new_text: 'validateUserData(data)' })"
notes:
    - old_text must appear exactly once in file
    - Exact string match including all whitespace
    - Automatic backup by default (backup=true)
    - Case-sensitive matching
    - Multi-line text supported